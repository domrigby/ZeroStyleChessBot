name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies and build chess_moves
        run: uv sync --frozen

      # The lock resolves Linux torch to the CUDA build; CI has no GPU, so swap in the
      # CPU wheel of the same version. Kept out of pyproject.toml so GPU users still get CUDA.
      - name: Swap in CPU-only torch
        run: |
          TORCH_VERSION=$(uv run --no-sync python -c "import torch; print(torch.__version__.split('+')[0])")
          uv pip install --reinstall-package torch "torch==${TORCH_VERSION}" \
            --index https://download.pytorch.org/whl/cpu

      # Lint and type checks run here, not in a separate job: mypy needs torch importable, and this job has already
      # synced it. Same commands as .pre-commit-config.yaml.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Run tests
        run: uv run --no-sync pytest -m "not integration" -v

      - name: Run integration tests
        run: uv run --no-sync pytest tests/integration -m "not slow" -v
