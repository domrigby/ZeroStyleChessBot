[project]
name = "zero-style-chess-bot"
version = "0.1.0"
description = "AlphaZero-style chess engine: supervised pre-training plus MCTS self-play."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11.2",
    "hydra-core>=1.3.8,<1.4",
    "matplotlib>=3.10.3",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "pydantic>=2.14",
    "pygame>=2.6.1",
    "tensorboard>=2.19.0",
    "torch>=2.7.0",
    "wandb>=0.19.0",
]

[dependency-groups]
dev = [
    "line-profiler>=4.2.0",
    "mypy>=2.4.1",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.2",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
# Only the C++ chess_moves extension is installed; the Python code runs from the repo root.
wheel.packages = []

[tool.uv]
# Rebuild chess_moves whenever the C++ source or build config changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp_chess_env/**/*.cpp" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: multi-process tests that spawn agents/evaluators/trainers (deselect with -m 'not integration')",
    "slow: integration tests that run for minutes (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "stubs"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
files = [
    "zero_style_chess_engine",
    "util",
    "neural_nets",
    "scripts",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "zero_style_chess_engine.*",
    "util.*",
    "neural_nets.conv_net",
    "neural_nets.encoding",
    "scripts.*",
    "tests.*",
]
disallow_untyped_defs = true
